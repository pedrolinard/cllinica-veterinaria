services:
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres
    environment:
      POSTGRES_DB: vetclinic
      POSTGRES_USER: vetclinic
      POSTGRES_PASSWORD: vetclinic
    ports:
      - "5432:5432"
    volumes:
      - vetclinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: vetclinic-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/vetclinic
      DATABASE_USERNAME: vetclinic
      DATABASE_PASSWORD: vetclinic
      # Sem valor padrão de propósito: defina em um arquivo .env (veja .env.example)
      # antes de subir. Sem eles, o container sobe e a API falha o boot (JWT_SECRET)
      # ou recusa criar o admin de demonstração (SEED_ADMIN_PASSWORD).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET em um arquivo .env antes de subir}
      SEED_ENABLED: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@vetclinic.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?defina SEED_ADMIN_PASSWORD em um arquivo .env antes de subir}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      PORT: 8080
      # Lembrete de consulta por email: desligado por padrão. Para ligar, defina
      # REMINDERS_ENABLED=true e as credenciais SMTP (SPRING_MAIL_HOST,
      # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD) num arquivo .env.
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  vetclinic_pgdata:
