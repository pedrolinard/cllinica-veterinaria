version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
