spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vetclinic}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:vetclinic}
    password: ${DATABASE_PASSWORD:vetclinic}
    hikari:
      # O Postgres é acessado via pooler do Supabase, que tem teto de conexões.
      # Poucas conexões, liberadas rápido quando ociosas.
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # ddl-auto (validate) vem do application.yml base.
  flyway:
    locations: classpath:db/migration,classpath:db/migration-postgresql

server:
  # Atrás do proxy do Railway (TLS terminado lá): confia nos X-Forwarded-* para
  # HSTS funcionar, o IP real do cliente aparecer no log e no throttle de login,
  # e o esquema ser reconhecido como https.
  forward-headers-strategy: framework

springdoc:
  # Swagger/OpenAPI desligados em produção (não há consumidor externo da API).
  # Ligue com SPRINGDOC_ENABLED=true só para uma demo, se precisar.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  jwt:
    # Sem fallback: se JWT_SECRET não estiver setado, o boot falha em vez de
    # assinar tokens com o segredo padrão que está no código-fonte.
    secret: ${JWT_SECRET}
  seed:
    enabled: ${SEED_ENABLED:true}
    # Sem fallback: se o seed estiver habilitado e a senha não for definida,
    # o DataSeeder falha o boot (ver DataSeeder.run) em vez de criar um admin
    # com a senha padrão do repositório.
    admin-password: ${SEED_ADMIN_PASSWORD:}
    # Sem fallback: sem SEED_DEMO_PASSWORD, as contas vet@/recepcao@ não são
    # criadas em produção (em vez de nascerem com uma senha fixa do código).
    demo-password: ${SEED_DEMO_PASSWORD:}
  cors:
    # Sem fallback: domínio(s) do frontend em produção, separados por vírgula
    # (ex: https://meu-frontend.vercel.app). Vazio = nenhuma origem liberada.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
