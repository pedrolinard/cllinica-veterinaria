spring:
  application:
    name: vet-clinic-api

  profiles:
    # Usado apenas quando nenhum perfil é ativado por outro meio (ex: env var
    # SPRING_PROFILES_ACTIVE, ou @ActiveProfiles nos testes). Diferente de
    # "spring.profiles.active", "default" nunca conflita com essas outras formas
    # de ativação de perfil.
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      # O schema é gerenciado por migrations versionadas (src/main/resources/db/migration),
      # não gerado automaticamente — "validate" só confirma que as entidades batem com o schema.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sem valor padrão de propósito: veja application-prod.yml — em produção o boot
    # falha se JWT_SECRET não estiver definido, em vez de assinar tokens com um
    # segredo previsível que está no código-fonte.
    secret: ${JWT_SECRET:apenas-para-dev-local-nao-usar-em-producao-00000000}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@vetclinic.com}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
  cors:
    # "*" é conveniente em dev/test; em produção, defina CORS_ALLOWED_ORIGINS com o(s)
    # domínio(s) reais do frontend (ver application-prod.yml).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  reminders:
    # Desligado por padrão: exige configurar um servidor SMTP de verdade
    # (SPRING_MAIL_HOST / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD) para ligar.
    enabled: ${REMINDERS_ENABLED:false}
    from: ${REMINDERS_FROM_EMAIL:no-reply@vetclinic.com}

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # health fica público (ver SecurityConfig); info/metrics exigem ADMIN.
        include: health,info,metrics
  endpoint:
    health:
      # "never": /actuator/health é público, então não expõe detalhe de componente
      # (ex: string de conexão do banco) para quem não está autenticado.
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

logging:
  level:
    com.vetclinic.api: INFO
